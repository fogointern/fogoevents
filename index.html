<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fogo Community Events</title>
  <link rel="icon" href="assets/fogo-logo.png" type="image/png" />
  <style>
    /* 🔥 Brand Colors */
    :root {
      --primary-bg: #121212; /* Dark background */
      --accent-orange: #FF4500; /* Accent color */
      --text-color: #FFFFFF;
    }

    body {
      background-color: var(--primary-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* 🔥 Hero Section */
    .hero {
      padding: 40px 20px;
      background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
    }

    .hero img {
      width: 120px;
      height: auto;
    }

    .hero h1 {
      font-size: 48px;
      margin: 20px 0 10px;
      color: var(--accent-orange);
      text-shadow: 0 0 10px var(--accent-orange);
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    /* 🔥 Events Section */
    #eventsContainer {
      padding: 20px;
      margin: auto;
      width: 90%;
      max-width: 600px;
      background: rgba(255, 69, 0, 0.1);
      border-radius: 10px;
      box-shadow: inset 0 0 15px rgba(255, 140, 0, 0.5);
    }

    #eventsTitle {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-color);
      text-shadow: 0 0 10px var(--text-color), 0 0 20px #ccc;
    }

    #events {
      list-style-type: none;
      padding: 0;
    }

    #events li {
      display: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
      margin: 10px auto;
      background: linear-gradient(90deg, #220b05, #ff4500, #ff7700);
      color: white;
      border-radius: 10px;
      text-align: center;
    }

    #events li.show {
      display: block !important;
      opacity: 1;
      transform: translateY(0);
    }

    /* 🔥 Buttons */
    .toggle-button {
      cursor: pointer;
      background: var(--accent-orange);
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      display: inline-block;
      margin-top: 15px;
      transition: 0.3s ease-in-out;
      font-weight: bold;
      border: none;
    }

    .toggle-button:hover {
      background: #ff7700;
      transform: scale(1.05);
    }

    /* 🔥 Calendar Section */
    #calendarTitle {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-color);
      text-shadow: 0 0 10px var(--text-color), 0 0 20px #ccc;
      margin-top: 40px;
    }

    #calendarFrame {
      width: 90%;
      height: 600px;
      border: 0;
      box-shadow: 0 0 30px rgba(255, 69, 0, 0.7);
      border-radius: 10px;
      margin: 20px auto;
      display: block;
    }

    /* 🔥 Footer */
    #footer {
      margin-top: 20px;
      font-size: 16px;
      color: #ff5733;
    }

    /* 🔥 Flame Ghost */
    .flame-ghost {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: auto;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 🔥 Responsive */
    @media (min-width: 768px) {
      #calendarFrame {
        width: 70%;
      }
    }
  </style>
</head>
<body>

  <!-- 🔥 Hero Section -->
  <div class="hero">
    <img src="assets/fogo-logo.png" alt="Fogo Logo" />
    <h1>Fogo Community Events</h1>
    <p>Stay updated with the latest happenings</p>
  </div>

  <!-- 🔥 Events Section -->
  <h2 id="eventsTitle">Today's Events</h2>
  <div id="eventsContainer">
    <ul id="events">Loading events...</ul>
    <button id="showMore" class="toggle-button" style="display: none;">See all</button>
    <button id="showLess" class="toggle-button" style="display: none;">Close</button>
  </div>

  <!-- 🔥 Calendar Section -->
  <h2 id="calendarTitle">Calendar</h2>
  <iframe id="calendarFrame"></iframe>

  <!-- 🔥 Footer -->
  <p id="footer">Made with ❤️ by Intern</p>

  <!-- 🔥 Flame Ghost -->
  <img src="assets/flame-ghost.png" alt="Flame Ghost" class="flame-ghost" />

  <!-- 🔥 Google Calendar API -->
  <script defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script>
    const API_KEY = 'AIzaSyDjVXwUbLWZv052kRzAXmjvxEWTGuY7BLw';
    const CALENDAR_ID = '287026a99cb10f73790c5dbcebfc76a12e564079e02f3b3be161b752b7d78f56@group.calendar.google.com';

    function gapiLoaded() {
      gapi.load('client', loadClient);
    }

    function loadClient() {
      gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"]
      }).then(() => getEvents());
    }

    function getEvents() {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];
      const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      gapi.client.calendar.events.list({
        'calendarId': CALENDAR_ID,
        'timeMin': now.toISOString(),
        'showDeleted': false,
        'singleEvents': true,
        'orderBy': 'startTime'
      }).then(response => {
        const events = response.result.items;
        const eventsList = document.getElementById('events');
        eventsList.innerHTML = '';

        let count = 0;

        events.forEach((event) => {
          const eventTime = new Date(event.start.dateTime || event.start.date);
          const eventDateStr = eventTime.toISOString().split('T')[0];
          const isAllDay = !event.start.dateTime;

          if (eventDateStr === todayStr && (isAllDay || eventTime > now)) {
            const li = document.createElement('li');
            const localTime = new Intl.DateTimeFormat(navigator.language, {
              hour: '2-digit',
              minute: '2-digit',
              timeZone: userTimezone
            }).format(eventTime);
            const description = event.description ? `📍${event.description}` : '';
            li.innerHTML = `<strong>${event.summary}</strong> - ⏰ ${localTime} - ${description}`;

            if (count < 3) li.classList.add('show');
            eventsList.appendChild(li);
            count++;
          }
        });

        if (count === 0) {
          eventsList.innerHTML = '<li class="show">No Events 😴</li>';
        } else {
          document.getElementById('showMore').style.display = 'inline-block';
        }
      }).catch(error => {
        console.error("Error fetching events:", error);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      document.getElementById("calendarFrame").src = 
        `https://calendar.google.com/calendar/embed?src=${CALENDAR_ID}&ctz=${encodeURIComponent(userTimezone)}`;

      document.getElementById("showMore").addEventListener("click", function () {
        document.querySelectorAll("#events li").forEach(li => li.classList.add('show'));
        document.getElementById("showMore").style.display = "none";
        document.getElementById("showLess").style.display = "inline-block";
      });

      document.getElementById("showLess").addEventListener("click", function () {
        document.querySelectorAll("#events li").forEach((li, index) => {
          if (index >= 3) li.classList.remove('show');
        });
        document.getElementById("showMore").style.display = "inline-block";
        document.getElementById("showLess").style.display = "none";
      });
    });
  </script>
</body>
</html>
